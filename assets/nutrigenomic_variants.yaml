  # FADS1 / FADS2 — omega-3 / omega-6 desaturation (algae DHA strategy check)
  # =====================================================================
  - id: FADS1_rs174546
    rsid: rs174546
    gene: FADS1
    chrom: chr11
    pos: 61802358
    ref: C
    alt: T
    risk_allele: T    # T = lower desaturase activity, slower ALA→EPA→DHA
    name: "FADS1 rs174546"
    category: nutrition_lipid
    evidence_tier: A
    condition: "Reduced fatty-acid desaturase activity; slower endogenous EPA/DHA synthesis from plant ALA"
    interpretation: |
      T-allele carriers convert plant α-linolenic acid (ALA) to long-chain
      omega-3s (EPA, DHA) less efficiently. For a vegetarian whose dietary
      DHA/EPA depends on endogenous conversion from ALA (flax, walnut,
      chia) rather than direct fish/algae intake, TT homozygotes are most
      likely to be functionally low on DHA. Confirms the value of direct
      algae-derived EPA/DHA supplementation as a hedge against poor
      conversion — especially important preconception and during pregnancy
      (DHA for fetal neurodevelopment).
    citations:
      - "PMID: 16677002 (Schaeffer 2006, original GWAS, Hum Mol Genet)"
      - "PMID: 21677062 (Lemaitre 2011, CHARGE consortium meta-analysis)"
      - "https://www.snpedia.com/index.php/rs174546"

