    chrom: chr17
    pos: 63488530
    ref: G
    alt: A
    risk_allele: G   # G corresponds to the D (deletion) allele — higher ACE activity
    name: "ACE rs4343 (tag SNP for I/D polymorphism)"
    category: nutrition_athletic_cardiovascular
    evidence_tier: B
    condition: "ACE activity; modest association with athletic performance and BP response"
    interpretation: |
      The famous ACE polymorphism is a 287-bp Alu indel (I/D, rs4646994)
      that is not detectable from standard SNP-only VCFs. rs4343 is in
      tight LD with I/D — G typically tags D (higher ACE activity,
