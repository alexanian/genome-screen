  - id: VDR_Fok1
    rsid: rs2228570
    gene: VDR
    chrom: chr12
    pos: 47879112
    ref: A     # f allele (long protein, lower transcriptional activity)
    alt: G     # F allele (short protein, higher activity)
    risk_allele: A   # 'f' allele
    name: "VDR FokI (rs2228570)"
    category: nutrition_micronutrient
    evidence_tier: B
    condition: "VDR translation start site polymorphism affecting receptor isoform; modest influence on bone density / Ca absorption / immunity"
    interpretation: |
      Fok1 affects the translation start site of VDR (the only Fok1
      variant that actually changes the protein, vs Bsm1/Taq1/Apa1 which
      are intronic or synonymous tag SNPs). The 'f' (A) allele encodes a
      slightly longer, less-active receptor. Effects on bone mineral
      density and calcium absorption are real but modest. May modestly
      shift vitamin D supplementation target (consider serum 25(OH)D
      monitoring at 30 ng/mL minimum, target ~40-60 if symptomatic).
    citations:
      - "PMID: 9101294 (Arai 1997, original FokI characterization, J Bone Miner Res)"
      - "https://www.snpedia.com/index.php/rs2228570"

