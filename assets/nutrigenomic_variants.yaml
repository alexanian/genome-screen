  # =====================================================================
  - id: FUT2_secretor
    rsid: rs601338
    gene: FUT2
    chrom: chr19
    pos: 48703417
    ref: G
    alt: A
    risk_allele: A    # AA = non-secretor
    name: "FUT2 rs601338 (W143X, non-secretor)"
    category: nutrition_microbiome
    evidence_tier: A
    condition: "Non-secretor (AA): no ABO antigens in mucosal secretions; ~20% lower vitamin B12 absorption; altered gut microbiome; ~50% lower norovirus susceptibility"
    interpretation: |
      Non-secretors (AA homozygous) have ~15-30% lower B12 absorption and
      altered gut microbiota (fewer Bifidobacterium). For a vegetarian
      already at higher B12-deficiency risk, AA status is a meaningful
      argument for routine B12 supplementation and periodic B12/MMA
      monitoring. Also notable: AA is protective against norovirus
      gastroenteritis (rs601338 was the gene's discovery via norovirus
      susceptibility GWAS).
    citations:
      - "PMID: 19057669 (Hazra 2009, B12 GWAS, Nat Genet)"
      - "PMID: 19089878 (Tanaka 2009, B12 replication)"
      - "https://www.snpedia.com/index.php/rs601338"

  # =====================================================================
  # BCMO1 — beta-carotene → retinol conversion (CRITICAL for vegetarians)
  # =====================================================================
  - id: BCMO1_rs12934922
    rsid: rs12934922
    gene: BCO1     # newer official symbol; BCMO1 historical
    chrom: chr16
    pos: 81264597
    ref: T
    alt: A
    risk_allele: A    # A allele reduces conversion efficiency ~50%
    name: "BCO1 (BCMO1) rs12934922 (Thr170Met)"
    category: nutrition_vegetarian
    evidence_tier: A
    condition: "Reduced β-carotene → retinol conversion efficiency"
    interpretation: |
      Carriers of the A allele convert dietary β-carotene to retinol
      ~50% less efficiently than homozygous T/T. For a vegetarian relying
      on plant carotenoids as the primary vitamin A source, AA homozygotes
      especially may be functionally vitamin-A deficient despite adequate
      β-carotene intake. Preconception/pregnancy specifically: vitamin A
      requirements rise, and most prenatal vitamins use β-carotene rather
      than preformed retinol — worth checking the label and considering a
      preformed-retinol prenatal. Confirm with serum retinol if concerned.
    citations:
      - "PMID: 19553537 (Leung 2009, FASEB J — conversion efficiency)"
      - "PMID: 22113863 (Lietz 2012, J Nutr — vitamin A status interaction)"
      - "https://www.snpedia.com/index.php/rs12934922"

