    category: nutrition_micronutrient
    evidence_tier: B
    condition: "Reduced sodium-dependent vitamin C transporter activity → lower plasma ascorbate at given intake"
    interpretation: |
      The T allele reduces SLC23A1 (SVCT1) transporter function. T-allele
      carriers have lower steady-state plasma vitamin C levels at any
      given dietary intake, particularly noticeable below ~100 mg/day.
      Modest practical implication: T carriers may need to consistently
      hit dietary vitamin C targets (citrus, peppers, leafy greens are
      easy in a vegetarian diet) rather than relying on sporadic intake.
    citations:
