# Nutrigenomic variants — diet- and supplementation-relevant SNPs.
#
# Distinct from assets/curated_risk_variants.yaml: these are *weaker* in
# evidence and *softer* in actionability — they shift dietary/supplementation
# decisions rather than triggering clinical workup. Most have tier B; the
# tier-A entries are the ones with consistent meta-analysis support.
#
# Asset sourcing note: the original plan was to seed this list by scraping
# MyGeneFood (https://www.mygenefood.com/genes/) for variants with science
# grade >= B-. Their Terms of Service explicitly prohibit scraping,
# systematic retrieval, and derivative compilations
# (https://www.mygenefood.com/terms — Prohibited Activities clauses). We
# instead hand-curated this list from primary literature and SNPedia
# (CC-BY-NC-SA 3.0, attribution-friendly), shaped by the user's specific
# context (vegetarian diet, known MTHFR compound heterozygosity, algae-
# derived omega-3 supplementation, IVF/PGT-P planning).
#
# Coordinates are GRCh38 from dbSNP build 156. They should be verified at
# runtime by lookup_variants.py — variants returning "no_data" across many
# rows likely indicate either a coordinate error or a real coverage gap.

source:
  generated_at: '2026-05-24'
  curator: 'Tessa Alexanian + Claude (with starter list from another Claude session)'
  schema_version: '1.0'
  primary_references:
    - "SNPedia (https://www.snpedia.com) — community wiki, CC-BY-NC-SA 3.0"
    - "PharmGKB (https://www.pharmgkb.org) — public domain pathway annotations"
    - "Garcia-Bailo et al. 2009, Mol Genet Metab, PMID 19342287 (nutrigenetics review)"
    - "Camp & Trujillo 2014, Curr Opin Lipidol, PMID 24535403 (dietary nutrigenetics)"

variants:

  # =====================================================================
  # MTHFR — folate / one-carbon metabolism (user already knows compound het status)
  # =====================================================================
  - id: MTHFR_C677T
    rsid: rs1801133
    gene: MTHFR
    chrom: chr1
    pos: 11796321
    ref: G
    alt: A
    risk_allele: A
    name: "MTHFR C677T (Ala222Val)"
    category: methylation_folate
    evidence_tier: A
    condition: "Reduced MTHFR enzyme activity (~35% TT, ~65% CT vs CC); elevated homocysteine; folate cofactor preference for 5-MTHF over folic acid"
    interpretation: |
      Most-studied folate-metabolism variant. TT homozygotes have markedly
      reduced enzyme activity and benefit from 5-MTHF (methylfolate) rather
      than folic acid. Compound het with A1298C (commonly self-reported in
      direct-to-consumer reports) has intermediate activity. Documented here
      for completeness — user already knows her status.
    citations:
      - "PMID: 7647779 (Frosst 1995, original C677T characterization, Nat Genet)"
      - "https://www.snpedia.com/index.php/rs1801133"

  - id: MTHFR_A1298C
    rsid: rs1801131
    gene: MTHFR
    chrom: chr1
    pos: 11794419
    ref: T
    alt: G
    risk_allele: G
    name: "MTHFR A1298C (Glu429Ala)"
    category: methylation_folate
    evidence_tier: A
    condition: "Modest reduction in MTHFR activity; compound het with C677T is the most common 'reduced-activity' genotype"
    interpretation: |
      Mild effect alone; significant in compound heterozygous configuration
      with C677T. Compound C677T het + A1298C het reduces activity to ~50%
      of CC/AA, similar to a single C677T homozygote.
    citations:
      - "PMID: 9545395 (van der Put 1998, Am J Hum Genet)"
      - "https://www.snpedia.com/index.php/rs1801131"

