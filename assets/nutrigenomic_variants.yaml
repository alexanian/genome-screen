  # MCM6/LCT — lactase persistence (relevant for vegetarian dairy reliance)
  # =====================================================================
  - id: MCM6_rs4988235
    rsid: rs4988235
    gene: LCT     # the SNP is in MCM6 but regulates LCT
    chrom: chr2
    pos: 135851076
    ref: G
    alt: A
    risk_allele: G   # G/G is non-persistent (lactose intolerant adults); A allele confers lactase persistence
    name: "MCM6/LCT rs4988235 (lactase persistence)"
    category: nutrition_carbohydrate
    evidence_tier: A
    condition: "Lactase persistence in European populations: A allele dominant; G/G is the ancestral non-persistent state"
    interpretation: |
      AA or AG: lactase-persistent into adulthood (can digest dairy).
      GG: non-persistent — adult-onset lactose maldigestion / intolerance.
      Population frequency varies enormously by ancestry (>90% persistent
      in Northern Europe, <10% in East Asia and West Africa). For a
      vegetarian who relies on dairy as a protein/calcium source, GG
      status meaningfully limits options; alternative calcium sources
      (leafy greens, fortified plant milks, calcium-set tofu) and
      protein sources should be planned for.
    citations:
      - "PMID: 14758574 (Enattah 2002, Nat Genet — original report)"
      - "https://www.snpedia.com/index.php/rs4988235"

