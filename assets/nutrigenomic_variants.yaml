  # =====================================================================
  - id: ACTN3_R577X
    rsid: rs1815739
    gene: ACTN3
    chrom: chr11
    pos: 66560624
    ref: C
    alt: T
    risk_allele: T   # X (T) = null allele, no alpha-actinin-3 in fast-twitch fibers
    name: "ACTN3 R577X (rs1815739)"
    category: nutrition_athletic
    evidence_tier: A
    condition: "Alpha-actinin-3 expression in fast-twitch muscle: T/T (XX) homozygotes lack the protein"
    interpretation: |
      C/C (RR): full alpha-actinin-3 — overrepresented among elite power
      athletes (sprinters, jumpers).
      T/T (XX): no alpha-actinin-3 — modestly overrepresented among elite
      endurance athletes. ~18% of Europeans are XX.
      C/T: intermediate.
      Effect sizes are small at the individual level; this is mostly a
      "fun to know" variant. There's some evidence that XX individuals have
      faster recovery from eccentric muscle damage and slightly less risk
      of strain injuries, but training response varies widely.
    citations:
      - "PMID: 12915476 (Yang 2003, Am J Hum Genet — original elite-athlete report)"
      - "PMID: 18043712 (MacArthur 2008, Hum Mol Genet — comprehensive review)"

