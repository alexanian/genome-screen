# Curated risk variants — variants with clear clinical actionability that
# ClinVar does NOT generally flag as Pathogenic/Likely-Pathogenic at 2-star
# review, but which are well-evidenced enough to warrant explicit reporting.
#
# Distinct from:
#   - assets/acmg_sf_v3_3.yaml: the expert-panel-curated SF list (84 genes).
#   - assets/nutrigenomic_variants.yaml: weaker-evidence diet/lifestyle SNPs.
#
# All GRCh38 coordinates. Coordinates were pulled from dbSNP build 156 and
# should be programmatically verified via bin/lookup_variants.py at runtime
# against a current dbSNP release (the script can fail-loud if positions drift).
#
# Evidence tiers:
#   A — strong: large GWAS / meta-analysis, replicated, mechanistically clear,
#       clinically actionable (e.g. changes preventive care or risk stratification).
#   B — moderate: replicated association, but effect size modest, interpretation
#       requires context, or actionability less clear.

source:
  generated_at: '2026-05-24'
  curator: 'Tessa Alexanian + Claude'
  schema_version: '1.0'
  note: |
    Hand-curated. Coordinates verified once at authoring time; rerun
    bin/verify_curated_coords.py against a current dbSNP VCF to catch drift.
    Risk allele is given as the alt by convention but is the dbSNP minor
    allele — for some variants (e.g. APOE ε3 'wildtype') the risk allele
    may differ from convention.

# Variants that must be interpreted jointly (e.g. APOE diplotype, HFE
# compound het) are flagged by `interpretation_group:`; a special-case
# script consolidates the per-variant lookups into a single call.
combinations:
  - id: APOE_diplotype
    component_variants: [APOE_rs429358, APOE_rs7412]
    description: |
      The APOE ε2/ε3/ε4 alleles are defined by the joint genotype at
      rs429358 (Cys112Arg) and rs7412 (Arg158Cys). Each gives a 2-letter
      haplotype. ε3 is the wildtype reference; ε4 increases AD and CAD risk;
      ε2 is mildly protective for AD but raises type-III hyperlipoproteinemia
      risk. Diplotype derived by bin/apoe_genotype.py.
    handler: bin/apoe_genotype.py

  - id: HFE_zygosity
    component_variants: [HFE_C282Y, HFE_H63D]
    description: |
      Hereditary hemochromatosis penetrance depends on the joint genotype:
      C282Y/C282Y (highest), C282Y/H63D compound het (moderate, lower
      penetrance), C282Y/wt (carrier, mild iron-overload risk only in some
      contexts), H63D/H63D (mild). ACMG SF reports ONLY C282Y/C282Y — the
      compound het and other combinations are flagged here instead.
    handler: bin/hfe_genotype.py


